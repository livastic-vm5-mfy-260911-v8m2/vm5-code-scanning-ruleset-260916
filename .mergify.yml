pull_request_rules:
  - name: VM5 autosquash old-head gate
    conditions:
      - title = VM5_AUTOSQUASH_CHECK_FRESHNESS_20260916
      - "#commits >= 2"
      - check-success = @github-actions/guard
    actions:
      rebase:
        autosquash: true
  - name: VM5 autosquash post-rewrite merge
    conditions:
      - title = VM5_AUTOSQUASH_CHECK_FRESHNESS_20260916
      - "#commits = 1"
    actions:
      merge:
        method: merge
